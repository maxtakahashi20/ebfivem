name: backup

# Cópia diária do banco. O repositório é público: o arquivo sai criptografado,
# porque tem telefone e RG. Segredos: DATABASE_URL e BACKUP_PASSPHRASE.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    container: postgres:17-alpine
    steps:
      - name: Gerar cópia criptografada
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          apk add --no-cache gnupg >/dev/null
          set -o pipefail  # sem isto, um pg_dump que falha gera backup vazio com job verde
          pg_dump "$DATABASE_URL" --no-owner --no-privileges --schema=public \
            | gzip \
            | gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
                --symmetric --cipher-algo AES256 -o backup.sql.gz.gpg
          test -s backup.sql.gz.gpg
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_number }}
          path: backup.sql.gz.gpg
          retention-days: 30
